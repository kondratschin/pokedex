<svg width="1.5rem" height="1.5rem" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer circle -->
    <circle cx="100" cy="100" r="100" fill="black" />
    <circle cx="100" cy="100" r="95" fill="white" />

    <!-- Middle black band -->
