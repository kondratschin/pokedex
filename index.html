<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="shortcut icon" href="./img/pokelogo_black.svg" type="image/x-icon">
    <script src="./pokedex.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        <link rel="stylesheet" href="style.css">

</head>

<body>
 
    <div class="overflow-wrapper">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img class="poklogo" src="./img/pokelogo_black.svg" alt="">Pokedex</a>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
    </nav>

    <div class="content">

    <div class="card">
        <div class="card-header">
            <div id="card-no" class="left-text">Left Text</div>
            <div id="mo-name" class="centered-text">Centered Text</div>
        </div>
        <div class="card-image"> <!-- pictures are in css -->

        </div>
        <div class="card-icons">
            <img src="https://via.placeholder.com/30" alt="Icon 1">
            <img src="https://via.placeholder.com/30" alt="Icon 2">
            <img src="https://via.placeholder.com/30" alt="Icon 3">
        </div>
    </div>


</div>

    </div>
</body>

</html>
